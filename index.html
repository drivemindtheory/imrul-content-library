els #NatureReels", "sizeMB": 10.5}, {"series": "01 - Wildlife", "name": "Serial 04 - Pufferfish Sand Circle", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/1A4iTOp0G0vw4LFIhW5ZM0FFb7mXpRx6W", "watch": "https://drive.google.com/file/d/1WlqQZKLZ464WBlkVfJzpWLQPCSPS14_n/view", "download": "https://drive.google.com/uc?export=download&id=1WlqQZKLZ464WBlkVfJzpWLQPCSPS14_n", "captionDownload": "https://drive.google.com/uc?export=download&id=1UthcGMfZNRSMtcR48nMh34vk2mWZtKzA", "caption": "The Tiny Fish That Draws Masterpieces in the Sand 🐡\n\nThis pufferfish is twenty centimetres long — and the pattern he digs into the seabed is two metres wide. For days he sweeps valleys and ridges into the sand with his fins, decorates the centre with shells, and smooths it flat. It is not art for us. If a female approves of his work, she lays her eggs in the middle of it.\n\n#Pufferfish #SandCircle #OceanWildlife #AnimalEngineering #NatureDocumentary #Japan #MarineLife #WildlifeReels #NatureReels #Underwater", "sizeMB": 17.6}, {"series": "01 - Wildlife", "name": "Serial 05 - Tailorbird Leaf Stitching", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/1WMo6on-jv7K1nn_nittYKOheAr1EHd-O", "watch": "https://drive.google.com/file/d/1besJ8THf_7AQwQrf7mozGfB15PW8CTn5/view", "download": "https://drive.google.com/uc?export=download&id=1besJ8THf_7AQwQrf7mozGfB15PW8CTn5", "captionDownload": "https://drive.google.com/uc?export=download&id=166_m5tIcAPZJznmD-dqr2s2f-WJ_CtWK", "caption": "The Bird That Sews Its Nest Into a Living Leaf 🪡\n\nThis common tailorbird — the tuntuni — does not weave twigs like other birds. She takes a single living leaf, pierces its edges with a beak like a needle, and stitches them together with spider silk and plant fibre. The leaf curls into a hanging cradle, and inside it, hidden from hunters, she builds a soft cup of grass.\n\n#Tailorbird #Tuntuni #Birds #NestBuilding #AnimalEngineering #NatureDocumentary #Wildlife #WildlifeReels #NatureReels #BirdWatching", "sizeMB": 10.8}, {"series": "01 - Wildlife", "name": "Serial 06 - Trapdoor Spider Ambush Door", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/1rnNSvlyyIDQlrJXA7NG0mm1nK0TbxETN", "watch": "https://drive.google.com/file/d/1w0KDYV54stoemBOd1KWJl-ZRn5HvRzeX/view", "download": "https://drive.google.com/uc?export=download&id=1w0KDYV54stoemBOd1KWJl-ZRn5HvRzeX", "captionDownload": "https://drive.google.com/uc?export=download&id=1N5YxS8St2CL5nwQMaCOoBm4FKjbIF9gf", "caption": "The Spider With a Secret Door in the Ground 🕷️\n\nThis trapdoor spider does not spin a web and wait in the open. She digs a burrow, lines it with silk, and builds herself a door — hinged, camouflaged with soil and moss, invisible when it shuts. Anything that walks past never sees her coming. The door flips, she lunges, and the ground closes over both of them.\n\n#TrapdoorSpider #Spiders #AnimalEngineering #NatureDocumentary #Wildlife #MacroWildlife #WildlifeReels #NatureReels", "sizeMB": 9.1}, {"series": "01 - Wildlife", "name": "Serial 07 - Beaver Dam Builder", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/1brTBtjom3LDuoIcLLIx3ipS-W83E1xvH", "watch": "https://drive.google.com/file/d/1Cyrc8jgotiGSD8Mh0EZRZ9jDjn5_yc65/view", "download": "https://drive.google.com/uc?export=download&id=1Cyrc8jgotiGSD8Mh0EZRZ9jDjn5_yc65", "captionDownload": "https://drive.google.com/uc?export=download&id=178qSk-c_LEoNpPzZQpytq25fCF7oJ90k", "caption": "The Beaver That Dams a River to Build Its Own Pond 🦫\n\nThis beaver is not just building a dam — he is building the pond itself. Stick by stick, packed with mud and stone, his wall slows the stream until deep, still water spreads behind it. Predators cannot wade through that water to reach him, and the door to his home opens underneath it.\n\n#Beaver #Dam #AnimalEngineering #NatureDocumentary #Wildlife #Rivers #WildlifeReels #NatureReels", "sizeMB": 10.4}, {"series": "01 - Wildlife", "name": "Serial 08 - Orb-Weaver Web", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/1xigF25D204Lp6PLj_f-3a6P28zuukX3-", "watch": "https://drive.google.com/file/d/1Nc_CblQIsOhTyOrGMPTxgcb34G2RRGzi/view", "download": "https://drive.google.com/uc?export=download&id=1Nc_CblQIsOhTyOrGMPTxgcb34G2RRGzi", "captionDownload": "https://drive.google.com/uc?export=download&id=1cd9EEbopqZmyayFCQRFnqHXYDHAPAY6X", "caption": "The Spider That Rebuilds Her Web Every Morning 🕸️\n\nThis orb-weaver eats yesterday's web and spins a new one before dawn. A bridge thread on the breeze, spokes from a hub, then a sticky spiral measured out leg by leg. By sunrise the trap is finished and beaded with dew — and she sits at its centre, head down, feeling for the first tremor.\n\n#OrbWeaver #SpiderWeb #Spiders #AnimalEngineering #NatureDocumentary #Wildlife #WildlifeReels #NatureReels", "sizeMB": 4.7}, {"series": "01 - Wildlife", "name": "Serial 09 - Sand Bubbler Crab Pellet Art", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/1PIpLhZQ7_zMRpKJnJdSHFqyBegMdNbb5", "watch": "https://drive.google.com/file/d/1-Sg6NYoFCdggqjetUgvyH4su0qdeaoCt/view", "download": "https://drive.google.com/uc?export=download&id=1-Sg6NYoFCdggqjetUgvyH4su0qdeaoCt", "captionDownload": "https://drive.google.com/uc?export=download&id=1igVYWQxSZ_SsZWYUfTvy4Q-mjaN-OZxW", "caption": "The Tiny Crab That Draws a Galaxy in the Sand 🦀\n\nThis sand bubbler crab is not trying to make art. At low tide it scoops up wet sand, filters out the microscopic food, and flicks the leftovers away as neat little balls — thousands of them. Hour by hour a perfect radial galaxy spreads around its burrow. Then the tide comes back and erases everything, and tomorrow it draws again.\n\n#SandBubblerCrab #Crabs #AnimalArt #NatureDocumentary #Wildlife #BeachLife #WildlifeReels #NatureReels", "sizeMB": 10.7}, {"series": "01 - Wildlife", "name": "Serial 11 - Caddisfly Jeweled Case", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/1kqnGe4obdZAy4114bvLlav5IHuO42Bfp", "watch": "https://drive.google.com/file/d/1KKFMc_C-DdcZT71KyxRLLJ-PhiDEoPvA/view", "download": "https://drive.google.com/uc?export=download&id=1KKFMc_C-DdcZT71KyxRLLJ-PhiDEoPvA", "captionDownload": "https://drive.google.com/uc?export=download&id=1UmOzOcS-Ckj6lYdSYisdvRJO_QR_vAaZ", "caption": "The Insect That Wears Its House on Its Back 🐛\n\nThis caddisfly larva builds its home out of whatever the stream gives it — sand grains, shell fragments, tiny pebbles — glued one by one with silk from its own mouth. The result is a portable armoured tube it carries everywhere. When danger passes overhead, it vanishes inside, and all that is left is an innocent-looking pebble.\n\n#Caddisfly #Insects #AnimalEngineering #NatureDocumentary #Wildlife #WildlifeReels #NatureReels", "sizeMB": 8.1}, {"series": "01 - Wildlife", "name": "Serial 12 - Great Hornbill Sealed Nest", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/1Nn5d9EL5uDjBsote0sRoIJlG3XQOBE9O", "watch": "https://drive.google.com/file/d/1M7cQrHu7RAePBdJOtDxaMIi9GxzWYDu6/view", "download": "https://drive.google.com/uc?export=download&id=1M7cQrHu7RAePBdJOtDxaMIi9GxzWYDu6", "captionDownload": "https://drive.google.com/uc?export=download&id=1Ol4GpHDYFEG2-N7IQuBzVD7mN5ZgGTYI", "caption": "The Bird That Walls Herself Inside a Tree — For Two Months 🪶\n\nWhen it is time to lay her eggs, the female great hornbill climbs into a tree hole and does something astonishing: she plasters the entrance shut with mud, leaving only a narrow slit. For two months she does not come out. Every meal arrives through that slit in her mate's beak — while inside, in the dark, her chick grows up beyond the reach of predators.\n\n#Hornbill #Birds #AnimalEngineering #NatureDocumentary #Wildlife #WildlifeReels #NatureReels", "sizeMB": 18.9}, {"series": "01 - Wildlife", "name": "Serial 13 - Weaver Ants Leaf Nest", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/13n0dJyA_hgCwqE7woI8FaiS7po_6qNoQ", "watch": "https://drive.google.com/file/d/1D2xuXWX6taAd-9nv5zZ9JuAYeU4iUQRu/view", "download": "https://drive.google.com/uc?export=download&id=1D2xuXWX6taAd-9nv5zZ9JuAYeU4iUQRu", "captionDownload": "https://drive.google.com/uc?export=download&id=1ODGW6hvUTiloIBQI0BoudMHQ0_k9vZdo", "caption": "The Ants That Sew Leaves Together — Using Their Own Babies as Needles 🐜\n\nWeaver ants build nests out of living leaves, and their tool is alive too. Hundreds of workers chain their bodies together and haul leaf edges into place, straining against the spring of the leaf. Then they carry up their own larvae and squeeze them gently like glue guns, stitching the seam with silk. Leaf by leaf, a green palace grows in the treetops.\n\n#WeaverAnts #Ants #AnimalEngineering #NatureDocumentary #Wildlife #WildlifeReels #NatureReels", "sizeMB": 12.9}, {"series": "01 - Wildlife", "name": "Serial 14 - Diving Bell Spider Air Bell", "color": "#2e9e5b", "emoji": "🦁", "folder": "https://drive.google.com/drive/folders/1h_bhpItWxSjgTAdGTqFssokBnLridB_1", "watch": "https://drive.google.com/file/d/163PT0VLdjGCTL9SfhcPI6gdMmHJJw1ih/view", "download": "https://drive.google.com/uc?export=download&id=163PT0VLdjGCTL9SfhcPI6gdMmHJJw1ih", "captionDownload": "https://drive.google.com/uc?export=download&id=13-p7CJNjV54kQHze7G_U8SusLNYkvpEb", "caption": "The Spider That Lives Underwater — Inside a Bell of Air 🕷️\n\nThis diving bell spider spends its whole life under the surface of a pond, breathing air it carries down itself. First it spins a silk tent between the weeds. Then, trip after trip, it ferries bubbles from the surface, trapped in the hairs of its body, and releases them under the silk. The bubbles gather into a shining silver chamber — a diving bell, built by an animal the size of a fingernail.\n\n#DivingBellSpider #Spiders #Anim
